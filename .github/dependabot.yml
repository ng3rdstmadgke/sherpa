# 依存の更新の pull request を週に 1 回作る。minor / patch はまとめて 1 つの pull request にする
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Node.js の版 (web/.nvmrc) に合わせて手で上げる。Node.js の版より新しい型にしない
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
